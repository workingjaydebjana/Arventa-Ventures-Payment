<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Arventa Geometric AV Monogram & Shield -->
  <g filter="url(#glow)">
    <!-- "A" Left Stroke -->
    <path d="M 28 72 L 48 24 L 54 24 L 36 72 Z" fill="#ffffff" />
    
    <!-- "A" Crossbar / Connection -->
    <path d="M 33 55 L 67 55 L 63 62 L 30 62 Z" fill="url(#accentGrad)" />

    <!-- "V" Right Wing / "A" Right Leg -->
    <path d="M 46 24 L 52 24 L 72 72 L 64 72 Z" fill="#ffffff" />

    <!-- Center Security Sparkle / Dot -->
    <circle cx="50" cy="38" r="4" fill="#38bdf8" />
  </g>

  <!-- Tiny Verified Badge on bottom right -->
  <circle cx="78" cy="78" r="13" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
  <path d="M 73 78 L 76.5 81.5 L 83 75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
